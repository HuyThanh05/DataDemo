spring.application.name=backend
spring.config.import=optional:file:./application-local.properties
datademo.app.url=${DATADEMO_APP_URL:jdbc:mysql://localhost:3306/datademo_app?connectTimeout=5000&socketTimeout=10000}
datademo.app.username=${DATADEMO_APP_USER:datademo_app_user}
datademo.app.password=${DATADEMO_APP_PASSWORD:}
datademo.key-file=${DATADEMO_KEY_FILE:.local/connection.key}
spring.datasource.url=${datademo.app.url}
spring.datasource.username=${datademo.app.username}
spring.datasource.password=${datademo.app.password}
spring.datasource.hikari.pool-name=DataDemoAppPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.flyway.locations=classpath:db/migration
# Adopt the existing PoC table without skipping V1 or removing existing rows.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
server.error.include-message=never
server.error.include-stacktrace=never
spring.jdbc.template.query-timeout=10s
