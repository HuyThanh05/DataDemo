spring.application.name=backend
spring.config.import=optional:file:./application-local.properties
datademo.app.url=${DATADEMO_APP_URL:jdbc:mysql://localhost:3306/datademo_app?connectTimeout=5000&socketTimeout=10000}
datademo.app.username=${DATADEMO_APP_USER:datademo_app_user}
datademo.app.password=${DATADEMO_APP_PASSWORD:}
datademo.key-file=${DATADEMO_KEY_FILE:.local/connection.key}
server.error.include-message=never
server.error.include-stacktrace=never
